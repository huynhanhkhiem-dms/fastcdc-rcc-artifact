name: Populate reproducibility artifact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and expand artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o /tmp/fastcdc-artifact.zip             "https://raw.githubusercontent.com/quangvinhtran5678-maker/-fastcdc-rcc-artifact/main/GitHub_REPO_UPLOAD_READY.zip"
          rm -f README.md
          unzip -o /tmp/fastcdc-artifact.zip -d .
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f GitHub_REPO_UPLOAD_READY.zip
          rm -f .github/workflows/populate-artifact.yml

      - name: Commit artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish FastCDC RCC reproducibility artifact"
          git push
