name: Verify reproducibility artifact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline self-check
        run: python src/selfcheck.py

      - name: Remove one-time verification workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time verification workflow"
          git push
